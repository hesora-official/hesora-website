<style>
:root{
  --bg:#050b14;
  --bg2:#071426;
  --panel:rgba(10,23,42,.72);
  --panel2:#0b1b30;
  --text:#f5f8ff;
  --muted:#a7b5c8;
  --line:rgba(145,180,220,.16);
  --blue:#1683ff;
  --blue2:#4aa3ff;
  --cyan:#69d7ff;
  --shadow:0 24px 80px rgba(0,0,0,.38);
  --radius:24px;
  --max:1180px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at 70% 0%,#0b2c50 0,#06111f 35%,#050b14 72%);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100vh;position:relative}

.noise{
  position:fixed;inset:0;pointer-events:none;opacity:.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
.grid{
  position:fixed;inset:0;pointer-events:none;opacity:.22;
  background-image:linear-gradient(rgba(100,160,220,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(100,160,220,.055) 1px,transparent 1px);
  background-size:54px 54px;
  mask-image:linear-gradient(to bottom,black,transparent 85%);
}
.orb{
  position:fixed;width:520px;height:520px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,126,255,.18),transparent 65%);
  filter:blur(10px);pointer-events:none;transition:transform .15s ease-out;
}
.orb.one{top:-180px;right:-80px}
.orb.two{left:-260px;top:45vh;opacity:.5}

.wrap{width:min(var(--max),calc(100% - 40px));margin:auto}

.nav{
  position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(160,190,220,.12);
  background:rgba(4,10,18,.72);backdrop-filter:blur(18px);
}
.navin{height:74px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.08em}
.mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,#1b91ff,#0754b9);
  box-shadow:0 8px 28px rgba(15,130,255,.35);
  position:relative;overflow:hidden;
}
.mark:before{
  content:"";width:14px;height:14px;border:2px solid #fff;border-left-color:transparent;
  border-radius:5px;transform:rotate(45deg)
}
.links{display:flex;gap:7px}
.links button,.mobileBtn{
  border:0;background:transparent;color:#aebcd0;padding:10px 13px;border-radius:12px;transition:.25s
}
.links button:hover,.links button.active{color:#fff;background:rgba(255,255,255,.06)}
.navcta{border:1px solid rgba(75,166,255,.5)!important;color:#dff1ff!important;background:rgba(18,123,235,.12)!important}
.menu{
  display:none;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:white;border-radius:12px;padding:9px 12px
}
.mobileLinks{display:none;padding:10px 0 16px}
.mobileLinks.open{display:block}
.mobileLinks button{
  display:block;width:100%;text-align:left;border:0;background:transparent;
  color:#aebcd0;padding:11px 13px;border-radius:12px
}
.mobileLinks button:hover{background:rgba(255,255,255,.06);color:white}

.hero{
  min-height:calc(100vh - 74px);display:grid;align-items:center;padding:80px 0 70px;position:relative
}
.heroGrid{
  display:grid;grid-template-columns:1.04fr .96fr;gap:50px;align-items:center
}
.eyebrow{font-size:12px;letter-spacing:.22em;color:#7fb5e8;font-weight:700;margin-bottom:18px}
h1{
  font-size:clamp(56px,7.5vw,98px);line-height:.91;letter-spacing:-.065em;
  margin:0 0 26px;max-width:720px
}
.blue{color:var(--blue2)}
.lead{font-size:18px;line-height:1.7;color:#b9c6d6;max-width:620px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{
  border:1px solid var(--line);padding:14px 19px;border-radius:14px;color:#fff;
  background:rgba(255,255,255,.035);transition:.25s;display:inline-flex;align-items:center;gap:9px
}
.btn:hover{
  transform:translateY(-3px);border-color:rgba(75,166,255,.65);
  box-shadow:0 12px 34px rgba(0,100,220,.2)
}
.btn.primary{
  border:0;background:linear-gradient(135deg,#1c8cff,#0962d6);
  box-shadow:0 12px 34px rgba(0,113,240,.25)
}
.mini{
  display:flex;gap:22px;flex-wrap:wrap;margin-top:36px;color:#8397ad;font-size:12px
}
.mini span:before{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:#198cff;margin:0 9px 2px 0
}

.deviceWrap{
  min-height:470px;display:grid;place-items:center;position:relative;perspective:1200px
}
.device{
  width:290px;height:570px;border:8px solid #0c1420;border-radius:46px;background:#07111e;
  box-shadow:inset 0 0 0 2px #1e3348,0 35px 80px rgba(0,0,0,.5),0 0 80px rgba(0,119,255,.16);
  transform:rotateY(-13deg) rotateX(4deg);
  transition:transform .18s ease-out;position:relative;overflow:hidden
}
.device:before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 60% 30%,rgba(21,133,255,.28),transparent 38%),linear-gradient(145deg,#0b2947,#040b13 62%);
  z-index:0
}
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:105px;height:24px;background:#02060b;border-radius:0 0 16px 16px;z-index:3
}
.screen{position:absolute;inset:55px 24px 25px;z-index:2;overflow:hidden}

/* HESORA 3x3 Android Puzzle */
.puzzleGame{
  width:100%;height:100%;padding:15px 11px 9px;
  display:flex;flex-direction:column;color:#e8f7ff;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(56,189,248,.12),transparent 38%),linear-gradient(180deg,#07111f,#0a1424)
}
.puzzleTop{display:flex;justify-content:space-between;align-items:center;gap:7px}
.puzzleTop small{font-size:6px;letter-spacing:1.15px;color:#7dd3fc;font-weight:700}
.puzzleStatus{
  padding:4px 6px;border:1px solid rgba(56,189,248,.3);border-radius:20px;
  color:#38bdf8;font-size:6px;letter-spacing:.65px;background:rgba(56,189,248,.04)
}
.puzzleTitle{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.puzzleTitle strong{font-size:17px;line-height:1;letter-spacing:-.5px}
.puzzleTitle span{font-size:6.5px;color:#7891a8;line-height:1.35}

.puzzleBoard{
  width:150px;height:150px;margin:9px auto 8px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  gap:2px;padding:3px;border-radius:14px;
  background:#07101b;border:1px solid rgba(56,189,248,.22);
  box-shadow:0 0 28px rgba(56,189,248,.08),inset 0 0 18px rgba(56,189,248,.05);
  flex:none
}
.puzzleTile{
  position:relative;border:1px solid rgba(255,255,255,.08);border-radius:5px;
  background-color:#0b1a2a;background-repeat:no-repeat;
  background-size:300% 300%;overflow:hidden;padding:0;
  transition:transform .16s ease,filter .16s ease,border-color .16s ease;
}
.puzzleTile:hover{filter:brightness(1.22);border-color:rgba(105,215,255,.65)}
.puzzleTile.selected{
  border-color:#69d7ff;
  box-shadow:0 0 0 2px rgba(105,215,255,.28),0 0 15px rgba(56,189,248,.35);
  transform:scale(.94);z-index:2
}
.puzzleBoard.locked .puzzleTile{cursor:default}
.puzzleBoard.locked .puzzleTile:hover{filter:none}

.puzzleHint{
  text-align:center;min-height:24px;padding:0 4px;
  font-size:6.5px;line-height:1.35;color:#7891a8
}
.puzzleScore{
  display:flex;align-items:center;justify-content:space-between;
  padding:7px 9px;margin-top:auto;border:1px solid rgba(148,163,184,.12);
  border-radius:8px;background:rgba(255,255,255,.025);flex:none
}
.puzzleScore span{font-size:6px;letter-spacing:1px;color:#71869a}
.puzzleScore strong{font-size:8px;color:#38bdf8}
.puzzleStart{
  width:100%;border:1px solid rgba(56,189,248,.4);border-radius:8px;
  padding:8px;margin-top:7px;background:rgba(56,189,248,.08);
  color:#9ee7ff;font-family:inherit;font-size:7px;font-weight:700;
  letter-spacing:1.3px;transition:.2s ease;flex:none
}
.puzzleStart:hover{
  background:rgba(56,189,248,.16);box-shadow:0 0 18px rgba(56,189,248,.12);
  transform:translateY(-1px)
}
.puzzleComplete{
  position:absolute;inset:3px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  border-radius:10px;background:rgba(4,14,24,.76);
  border:1px solid rgba(105,215,255,.35);z-index:5;
  pointer-events:none
}
.puzzleComplete strong{
  font-size:13px;line-height:1;color:#c4f3ff;
  text-shadow:0 0 14px rgba(56,189,248,.65)
}
.puzzleComplete span{
  margin-top:5px;font-size:5.5px;color:#6fd8ff;letter-spacing:1px
}
/* Robot cursor */
.robot-particle{
  position:fixed;width:9px;height:7px;border-radius:3px 3px 4px 4px;
  pointer-events:none;z-index:99999;opacity:0;
  background:linear-gradient(135deg,#38bdf8,#60a5fa);
  box-shadow:0 0 7px rgba(56,189,248,.65),0 0 14px rgba(56,189,248,.2);
  animation:hesoraRobot .72s ease-out forwards
}
.robot-particle:before{
  content:"";position:absolute;width:2.5px;height:2.5px;border-radius:50%;
  background:#07111f;left:2px;top:2px;box-shadow:3px 0 0 #07111f
}
.robot-particle:after{
  content:"";position:absolute;width:1px;height:3px;background:#38bdf8;
  left:3px;top:-4px;box-shadow:2px 0 0 #38bdf8
}

.float{
  position:absolute;padding:10px 13px;border:1px solid rgba(83,170,255,.35);
  background:rgba(7,18,31,.75);backdrop-filter:blur(10px);border-radius:12px;
  color:#cfe8ff;font-size:12px;box-shadow:0 15px 40px rgba(0,0,0,.25);
  animation:float 4s ease-in-out infinite
}
.f1{right:2%;top:18%}
.f2{left:2%;bottom:19%;animation-delay:-1.7s}

.section{padding:110px 0;position:relative}
.sectionHead{max-width:760px;margin-bottom:48px}
.kicker{color:#6caeea;font-size:12px;letter-spacing:.2em;font-weight:800}
.section h2{font-size:clamp(38px,5vw,62px);letter-spacing:-.05em;line-height:1;margin:12px 0 18px}
.sub{color:#9eafc3;line-height:1.75;font-size:17px}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{
  padding:28px;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(12,31,53,.72),rgba(7,17,29,.62));
  box-shadow:var(--shadow);transition:.3s;position:relative;overflow:hidden
}
.card:before{
  content:"";position:absolute;width:140px;height:140px;border-radius:50%;
  background:rgba(18,129,255,.11);filter:blur(30px);top:-80px;right:-70px
}
.card:hover{transform:translateY(-7px);border-color:rgba(62,157,255,.45)}
.icon{
  width:42px;height:42px;border-radius:13px;background:rgba(24,132,255,.13);
  border:1px solid rgba(65,158,255,.22);display:grid;place-items:center;
  color:#7bc0ff;margin-bottom:22px
}
.card h3{margin:0 0 11px;font-size:19px}
.card p{margin:0;color:#93a6bb;line-height:1.65;font-size:14px}
.tag{display:inline-block;margin-top:18px;font-size:11px;color:#6faee9;letter-spacing:.08em}

.split{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:stretch}
.panel{border:1px solid var(--line);border-radius:28px;padding:34px;background:rgba(9,24,42,.62)}
.list{display:grid;gap:15px}
.listItem{display:flex;gap:14px}
.num{
  width:30px;height:30px;border-radius:10px;background:#0b2b4c;color:#6db8ff;
  display:grid;place-items:center;font-size:12px;font-weight:800;flex:none
}
.listItem strong{display:block;margin-bottom:5px}
.listItem span{color:#92a5b9;font-size:14px;line-height:1.55}

.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.trust .card{min-height:170px}

.faq{display:grid;gap:10px;max-width:900px}
.faqItem{border:1px solid var(--line);border-radius:18px;background:rgba(8,20,35,.62);overflow:hidden}
.faqQ{
  width:100%;border:0;background:transparent;color:#fff;text-align:left;
  padding:20px 22px;display:flex;justify-content:space-between;gap:20px
}
.faqA{
  max-height:0;overflow:hidden;color:#96a9bd;line-height:1.65;
  padding:0 22px;transition:max-height .3s,padding .3s
}
.faqItem.open .faqA{max-height:300px;padding:0 22px 20px}
.plus{color:#6db7ff;font-size:20px}

.contact{display:grid;grid-template-columns:.9fr 1.1fr;gap:22px}
.form{display:grid;gap:13px}
.field{
  width:100%;border:1px solid var(--line);background:rgba(4,12,21,.7);
  color:#fff;padding:15px 16px;border-radius:14px;outline:none
}
.field:focus{border-color:#238eff;box-shadow:0 0 0 3px rgba(35,142,255,.1)}
textarea.field{min-height:150px;resize:vertical}
.formNote{font-size:12px;color:#7f94aa;line-height:1.5}

.footer{border-top:1px solid var(--line);padding:35px 0 45px;color:#7f93a9;font-size:13px}
.footerIn{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.contactLinks{display:flex;gap:13px;flex-wrap:wrap}
.contactLinks a:hover{color:#fff}

.pageHero{padding:90px 0 45px}
.pageHero h1{font-size:clamp(50px,7vw,82px)}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease}
.reveal.show{opacity:1;transform:none}

@keyframes float{50%{transform:translateY(-10px)}}
@keyframes coreSpin{to{transform:rotate(360deg)}}
@keyframes nodePulse{
  0%,100%{transform:translate(-50%,-50%) scale(.85);box-shadow:0 0 6px #38bdf8,0 0 12px rgba(56,189,248,.5)}
  50%{transform:translate(-50%,-50%) scale(1.15);box-shadow:0 0 10px #38bdf8,0 0 24px rgba(56,189,248,.9)}
}
@keyframes hesoraRobot{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(0deg)}
  15%{opacity:.95}
  100%{
    opacity:0;
    transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.08) rotate(var(--rotation))
  }
}

@media(max-width:900px){
  .heroGrid,.split,.contact{grid-template-columns:1fr}
  .deviceWrap{min-height:430px}
  .cards{grid-template-columns:1fr 1fr}
  .trust{grid-template-columns:1fr}
  .links{display:none}
  .menu{display:block}
  .hero{padding-top:55px}
}

@media(max-width:600px){
  .wrap{width:min(var(--max),calc(100% - 26px))}
  .cards{grid-template-columns:1fr}
  .section{padding:80px 0}
  .device{width:245px;height:480px}
  .heroGrid{gap:15px}
  h1{font-size:58px}
  .lead{font-size:16px}
  .f1{right:-2%}
  .f2{left:-2%}
  .coreArena{width:126px;height:126px}
  .coreRing{width:91px;height:91px}
  .gameTitle strong{font-size:18px}
  .signalGame{padding:16px 10px 10px}
}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .robot-particle,.coreRing,.signalNode,.float{animation:none}
}

function setupPuzzle(){
  const board=document.getElementById("puzzleBoard");
  const start=document.getElementById("puzzleStart");
  const score=document.getElementById("puzzleScore");
  const hint=document.getElementById("puzzleHint");
  const status=document.querySelector(".puzzleStatus");

  if(!board||!start||!score||!hint||!status)return;
  if(board.dataset.ready==="1")return;
  board.dataset.ready="1";

  let order=[0,1,2,3,4,5,6,7,8];
  let selected=-1;
  let active=false;
  let moves=0;

  /*
    Original HESORA robot illustration.
    This is an original robot character, not the official Android mascot.
  */
  const robotSvg=`
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
    <defs>
      <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#69d7ff"/>
        <stop offset="1" stop-color="#1683ff"/>
      </linearGradient>
      <radialGradient id="g">
        <stop offset="0" stop-color="#123d5b"/>
        <stop offset="1" stop-color="#07111f"/>
      </radialGradient>
    </defs>
    <rect width="300" height="300" fill="#07111f"/>
    <circle cx="150" cy="150" r="132" fill="url(#g)"/>
    <circle cx="150" cy="150" r="112" fill="none" stroke="#174566" stroke-width="3"/>
    <circle cx="150" cy="150" r="101" fill="none" stroke="#0e2d45" stroke-width="1" stroke-dasharray="5 8"/>
    <path d="M108 78 L92 54" stroke="#69d7ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M192 78 L208 54" stroke="#69d7ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="91" cy="52" r="6" fill="#69d7ff"/>
    <circle cx="209" cy="52" r="6" fill="#69d7ff"/>
    <rect x="82" y="72" width="136" height="91" rx="34" fill="url(#b)"/>
    <rect x="94" y="85" width="112" height="67" rx="25" fill="#0a1b2c"/>
    <circle cx="126" cy="118" r="9" fill="#69d7ff"/>
    <circle cx="174" cy="118" r="9" fill="#69d7ff"/>
    <path d="M127 138 Q150 151 173 138" fill="none" stroke="#4aa3ff" stroke-width="5" stroke-linecap="round"/>
    <rect x="92" y="157" width="116" height="83" rx="26" fill="url(#b)"/>
    <rect x="116" y="175" width="68" height="42" rx="13" fill="#0a1b2c" stroke="#69d7ff" stroke-width="2"/>
    <path d="M128 188 H172 M128 201 H158" stroke="#4aa3ff" stroke-width="4" stroke-linecap="round"/>
    <rect x="62" y="170" width="25" height="62" rx="12" fill="#1683ff"/>
    <rect x="213" y="170" width="25" height="62" rx="12" fill="#1683ff"/>
    <rect x="111" y="233" width="28" height="36" rx="12" fill="#1683ff"/>
    <rect x="161" y="233" width="28" height="36" rx="12" fill="#1683ff"/>
    <circle cx="150" cy="150" r="3" fill="#fff" opacity=".7"/>
  </svg>`;

  const robotUrl="url(\"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(robotSvg)+"\")";

  function drawBoard(){
    board.innerHTML="";
    order.forEach((piece,index)=>{
      const tile=document.createElement("button");
      tile.type="button";
      tile.className="puzzleTile";
      tile.dataset.index=index;
      tile.dataset.piece=piece;
      tile.style.backgroundImage=robotUrl;
      tile.style.backgroundPosition=
        `${(piece%3)*50}% ${Math.floor(piece/3)*50}%`;

      tile.addEventListener("click",e=>{
        e.stopPropagation();
        if(!active)return;

        const idx=Number(tile.dataset.index);

        if(selected===-1){
          selected=idx;
          tile.classList.add("selected");
          hint.textContent="Now tap the piece you want to swap.";
          return;
        }

        if(selected===idx){
          selected=-1;
          tile.classList.remove("selected");
          hint.textContent="Choose a piece.";
          return;
        }

        [order[selected],order[idx]]=[order[idx],order[selected]];
        moves++;
        score.textContent=moves;
        selected=-1;

        for(let i=0;i<4;i++){
          createRobot(
            e.clientX+(Math.random()-.5)*14,
            e.clientY+(Math.random()-.5)*14,
            true
          );
        }

        drawBoard();
        checkSolved();
      });
      board.appendChild(tile);
    });
  }

  function scramble(){
    order=[0,1,2,3,4,5,6,7,8];

    /* Many random swaps keep the puzzle solvable because every move is a swap. */
    for(let i=0;i<18;i++){
      const a=Math.floor(Math.random()*9);
      let b=Math.floor(Math.random()*9);
      while(b===a)b=Math.floor(Math.random()*9);
      [order[a],order[b]]=[order[b],order[a]];
    }

    if(order.every((v,i)=>v===i)){
      [order[0],order[1]]=[order[1],order[0]];
    }

    selected=-1;
    moves=0;
    score.textContent="0";
    status.textContent="SOLVE";
    hint.textContent="Tap one piece, then another, to swap.";
    board.classList.remove("locked");
    drawBoard();
  }

  function checkSolved(){
    const solved=order.every((v,i)=>v===i);
    if(!solved)return;

    active=false;
    board.classList.add("locked");
    status.textContent="COMPLETE";
    hint.textContent="Android complete. Nice work.";
    start.textContent="PLAY AGAIN";

    const message=document.createElement("div");
    message.className="puzzleComplete";
    message.innerHTML="<strong>ANDROID<br>COMPLETE</strong><span>HESORA SYSTEM ONLINE</span>";
    board.appendChild(message);

    const r=board.getBoundingClientRect();
    for(let i=0;i<14;i++){
      setTimeout(()=>{
        createRobot(
          r.left+r.width/2+(Math.random()-.5)*110,
          r.top+r.height/2+(Math.random()-.5)*110,
          true
        );
      },i*45);
    }
  }

  function startGame(){
    board.querySelectorAll(".puzzleComplete").forEach(n=>n.remove());
    active=true;
    scramble();
    start.textContent="RESET";
  }

  function resetGame(){
    active=false;
    selected=-1;
    order=[0,1,2,3,4,5,6,7,8];
    moves=0;
    score.textContent="0";
    status.textContent="READY";
    hint.textContent="See the robot. Tap START to scramble it.";
    start.textContent="START";
    board.classList.remove("locked");
    drawBoard();
  }

  start.addEventListener("click",e=>{
    e.stopPropagation();
    if(active)resetGame();
    else startGame();
  });

  resetGame();
}

function setupMouse(){
  const area=document.getElementById("deviceArea");
  const device=document.getElementById("device");

  if(area&&device){
    area.onmousemove=e=>{
      const r=area.getBoundingClientRect();
      const x=(e.clientX-r.left)/r.width-.5;
      const y=(e.clientY-r.top)/r.height-.5;

      device.style.transform=
        `rotateY(${-13+x*12}deg) rotateX(${4-y*10}deg) translateY(${y*-8}px)`;

      const orb=document.querySelector(".orb.one");
      if(orb)orb.style.transform=`translate(${x*35}px,${y*25}px)`;
    };

    area.onmouseleave=()=>{
      device.style.transform="rotateY(-13deg) rotateX(4deg)";
    };
  }

  document.onmousemove=e=>{
    const x=e.clientX/innerWidth-.5;
    const y=e.clientY/innerHeight-.5;
    const orb=document.querySelector(".orb.two");
    if(orb)orb.style.transform=`translate(${x*-25}px,${y*-18}px)`;
  };
}

/* Robot cursor */
let lastRobotTime=0;

function createRobot(x,y,burst=false){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;

  const robot=document.createElement("div");
  robot.className="robot-particle";

  const spread=burst?70:30;

  robot.style.left=x+"px";
  robot.style.top=y+"px";
  robot.style.setProperty("--dx",((Math.random()-.5)*spread)+"px");
  robot.style.setProperty("--dy",((Math.random()-.5)*spread)+"px");
  robot.style.setProperty("--rotation",((Math.random()-.5)*120)+"deg");

  document.body.appendChild(robot);
  setTimeout(()=>robot.remove(),800);
}

document.addEventListener("mousemove",e=>{
  const now=Date.now();
  if(now-lastRobotTime<70)return;
  lastRobotTime=now;
  createRobot(e.clientX,e.clientY,false);
},{passive:true});

document.addEventListener("click",e=>{
  for(let i=0;i<5;i++){
    createRobot(
      e.clientX+(Math.random()-.5)*12,
      e.clientY+(Math.random()-.5)*12,
      true
    );
  }
});

document.addEventListener("touchstart",e=>{
  if(!e.touches.length)return;
  const t=e.touches[0];
  for(let i=0;i<4;i++){
    createRobot(
      t.clientX+(Math.random()-.5)*12,
      t.clientY+(Math.random()-.5)*12,
      true
    );
  }
},{passive:true});

render(location.hash.slice(1)||"home");
