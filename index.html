.section{padding:110px 0;position:relative}.sectionHead{max-width:760px;margin-bottom:48px}.kicker{color:#6caeea;font-size:12px;letter-spacing:.2em;font-weight:800}.section h2{font-size:clamp(38px,5vw,62px);letter-spacing:-.05em;line-height:1;margin:12px 0 18px}.sub{color:#9eafc3;line-height:1.75;font-size:17px}

<script>
const services=[

function home(){
return `${nav("home")}
<main>
<section class="hero"><div class="wrap heroGrid">
<div class="reveal"><div class="eyebrow">ANDROID & GOOGLE PLAY SOLUTIONS</div><h1>Build.<br><span class="blue">Publish.</span><br>Operate.</h1><p class="lead">${pageData.home.sub}</p>

${[["01","Requirement first","We start by understanding the actual technical or publishing problem."],["02","Practical scope","Services are defined around the work rather than vague packages."],["03","Execution","Implementation, configuration and documentation are handled step by step."],["04","Ongoing support","Projects can continue beyond the initial setup when ongoing technical help is needed."]].map(x=>`<div class="listItem"><div class="num">${x[0]}</div><div><strong>${x[1]}</strong><span>${x[2]}</span></div></div>`).join("")}</div></div></div></div></section>

function servicesPage(){return `${nav("services")}<main><section class="pageHero"><div class="wrap"><div class="kicker">SERVICES</div><h1>${pageData.services.title}</h1><p class="sub">${pageData.services.sub}</p></div></section><section class="section" style="padding-top:35px"><div class="wrap">${serviceCards()}</div></section><section class="section"><div class="wrap"><div class="panel reveal"><div class="kicker">NOTE</div><h2>Every project starts with the requirement.</h2><p class="sub">Availability, eligibility, platform rules, third-party approvals and technical constraints can vary by project. HESORA does not guarantee outcomes that depend on external platform decisions.</p></div></div></section></main>${footer()}`;}

const faqs=[

function render(page){const pages={home,services:servicesPage,about:aboutPage,faq:faqPage,contact:contactPage};document.getElementById("app").innerHTML=(pages[page]||home)();requestAnimationFrame(()=>{document.querySelectorAll(".reveal").forEach((el,i)=>setTimeout(()=>el.classList.add("show"),Math.min(i*55,450)));setupMouse();});window.scrollTo({top:0,behavior:"instant"});}
function go(page){history.pushState({},'',`#${page}`);render(page);document.querySelector(".mobileLinks")?.classList.remove("open");}
window.addEventListener("popstate",()=>render(location.hash.slice(1)||"home"));
window.addEventListener("hashchange",()=>render(location.hash.slice(1)||"home"));
function setupMouse(){const area=document.getElementById("deviceArea"),device=document.getElementById("device");if(!area||!device)return;area.onmousemove=e=>{const r=area.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;device.style.transform=`rotateY(${-13+x*12}deg) rotateX(${4-y*10}deg) translateY(${y*-8}px)`;document.querySelector(".orb.one").style.transform=`translate(${x*35}px,${y*25}px)`};area.onmouseleave=()=>device.style.transform="rotateY(-13deg) rotateX(4deg)";document.onmousemove=e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;document.querySelector(".orb.two").style.transform=`translate(${x*-25}px,${y*-18}px)`};}
render(location.hash.slice(1)||"home");
